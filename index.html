<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Coon — Camera & Social</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script>
<style>
.filter-none{filter:none}.filter-warm{filter:sepia(.35) saturate(1.8) hue-rotate(-10deg) brightness(1.05)}.filter-vintage{filter:sepia(.55) hue-rotate(-30deg) contrast(1.25) brightness(.92)}.filter-cyber{filter:invert(.2) hue-rotate(180deg) saturate(2.5) contrast(1.2)}.filter-bw{filter:grayscale(1) contrast(1.4) brightness(1.05)}.filter-neon{filter:saturate(3) hue-rotate(110deg) contrast(1.3)}.filter-dramatic{filter:contrast(1.6) saturate(1.3) brightness(.9)}.filter-cool{filter:hue-rotate(180deg) saturate(1.2) contrast(1.1)}
.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}.screen{transition:transform .25s ease}
</style>
</head>
<body class="bg-black text-white h-screen overflow-hidden font-sans">
<div id="auth" class="fixed inset-0 z-50 bg-black flex items-center justify-center p-6"><div class="w-full max-w-sm bg-neutral-900 border border-neutral-800 rounded-3xl p-6"><h1 class="text-3xl font-black text-center mb-2">Coon</h1><p class="text-center text-neutral-400 text-sm mb-6">Sign in to your social studio</p><div class="space-y-3"><input id="authUser" class="w-full bg-neutral-800 rounded-xl px-4 py-3 text-sm outline-none" placeholder="Username"><input id="authPass" type="password" class="w-full bg-neutral-800 rounded-xl px-4 py-3 text-sm outline-none" placeholder="Password"><button id="loginBtn" class="w-full bg-rose-600 rounded-xl py-3 font-bold">Log in</button><button id="registerBtn" class="w-full bg-neutral-800 rounded-xl py-3 font-bold">Create account</button><p id="authMsg" class="text-xs text-center text-neutral-400"></p></div></div></div>
<div class="mx-auto w-full max-w-[430px] h-full bg-neutral-950 relative overflow-hidden border border-neutral-800">
<section id="camera" class="screen absolute inset-0 z-30 translate-x-full bg-black flex flex-col"><header class="absolute top-0 inset-x-0 z-20 p-4 flex justify-between items-center bg-gradient-to-b from-black/90 to-transparent"><b class="text-2xl">Coon <small class="text-[9px] text-rose-400">STUDIO</small></b><div class="flex gap-2"><button id="aiBtn" class="px-3 py-2 rounded-full bg-rose-600 text-xs font-bold">✨ AI</button><button data-go="feed" class="p-2 rounded-full bg-neutral-800"><i data-lucide="x"></i></button></div></header><div class="relative flex-1 overflow-hidden"><video id="video" autoplay playsinline muted class="w-full h-full object-cover filter-none"></video><div id="flash" class="absolute inset-0 bg-white opacity-0 pointer-events-none"></div></div><div class="absolute bottom-0 inset-x-0 p-4 pt-16 bg-gradient-to-t from-black to-transparent"><div id="filters" class="flex gap-3 overflow-x-auto no-scrollbar pb-4"></div><div class="flex justify-between items-center px-5"><button id="flip" class="p-3 bg-neutral-800 rounded-full"><i data-lucide="refresh-cw"></i></button><button id="capture" class="w-20 h-20 rounded-full border-4 border-white p-1"><span class="block w-full h-full bg-white rounded-full"></span></button><button id="flashBtn" class="p-3 bg-neutral-800 rounded-full"><i data-lucide="zap"></i></button></div><div class="flex justify-center gap-8 pt-4"><button class="mode font-bold text-xs" data-mode="POST">POST</button><button class="mode text-neutral-500 font-bold text-xs" data-mode="STORY">STORY</button><button class="mode text-neutral-500 font-bold text-xs" data-mode="REELS">REELS</button></div></div><div id="aiPanel" class="hidden absolute top-20 inset-x-4 z-40 bg-neutral-900/95 border border-rose-500/40 rounded-2xl p-4"><div class="flex justify-between"><b class="text-rose-400 text-xs">COON VISION AI</b><button id="aiClose">×</button></div><p id="aiText" class="text-xs text-neutral-300 my-3">Analyze your current scene for a filter and caption suggestion.</p><button id="analyze" class="w-full py-2 rounded-xl bg-rose-600 text-xs font-bold">Analyze Scene</button></div></section>
<section id="feed" class="screen absolute inset-0 z-10 translate-x-0 bg-black flex flex-col"><header class="px-4 py-3 border-b border-neutral-800 flex justify-between items-center"><b class="text-2xl">Coon</b><div class="flex gap-4"><button data-go="notifications"><i data-lucide="heart"></i></button><button data-go="messages"><i data-lucide="send"></i></button></div></header><div id="feedList" class="flex-1 overflow-y-auto no-scrollbar"></div><nav class="p-3 border-t border-neutral-800 flex justify-between"><button data-go="feed"><i data-lucide="home"></i></button><button data-go="camera"><i data-lucide="plus-square"></i></button><button data-go="notifications"><i data-lucide="heart"></i></button><button data-go="messages"><i data-lucide="message-circle"></i></button><button data-go="profile"><i data-lucide="user"></i></button></nav></section>
<section id="messages" class="screen absolute inset-0 z-20 translate-x-full bg-black flex flex-col"><header class="p-4 border-b border-neutral-800 flex gap-3"><button data-go="feed"><i data-lucide="arrow-left"></i></button><b>Messages</b></header><div id="chat" class="flex-1 overflow-y-auto p-4 space-y-3"></div><div class="p-3 border-t border-neutral-800 flex gap-2"><input id="chatInput" class="flex-1 bg-neutral-800 rounded-full px-4 py-2 text-sm" placeholder="Message..."><button id="sendMsg" class="bg-rose-600 p-3 rounded-full"><i data-lucide="send"></i></button></div></section>
<section id="notifications" class="screen absolute inset-0 z-20 translate-x-full bg-black"><header class="p-4 border-b border-neutral-800 flex gap-3"><button data-go="feed"><i data-lucide="arrow-left"></i></button><b>Notifications</b></header><div id="notifs" class="p-4 space-y-4"></div></section>
<section id="profile" class="screen absolute inset-0 z-20 translate-x-full bg-black"><header class="p-4 border-b border-neutral-800 flex gap-3"><button data-go="feed"><i data-lucide="arrow-left"></i></button><b id="profileName">Profile</b></header><div id="profileBody" class="p-4 overflow-y-auto h-full"></div></section>
</div>
<script>
const API=window.COON_API_URL || location.origin;let token=localStorage.getItem('coon_token');let me=null,stream=null,filter='filter-none',filterName='Normal',mode='POST',facing='user';
const defs=[['filter-none','Normal'],['filter-warm','Warm'],['filter-vintage','Vintage'],['filter-cyber','Cyber'],['filter-bw','B&W'],['filter-neon','Neon'],['filter-dramatic','Dramatic'],['filter-cool','Cool']];
const $=id=>document.getElementById(id);async function api(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(API+path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.add('translate-x-full'));$(id).classList.remove('translate-x-full');if(id==='feed')loadFeed();if(id==='notifications')loadNotifs();if(id==='profile')loadProfile();}
async function auth(action){try{const d=await api('/api/auth/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('authUser').value.trim(),password:$('authPass').value})});token=d.token;localStorage.setItem('coon_token',token);me=d.user;$('auth').classList.add('hidden');show('feed');startCamera()}catch(e){$('authMsg').textContent=e.message}}
$('loginBtn').onclick=()=>auth('login');$('registerBtn').onclick=()=>auth('register');
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
$('filters').innerHTML=defs.map(([c,n])=>`<button class="f flex-shrink-0" data-f="${c}" data-n="${n}"><div class="w-14 h-14 rounded-full border-2 border-neutral-600 bg-neutral-800 flex items-center justify-center text-[10px]">${n}</div></button>`).join('');document.querySelectorAll('.f').forEach(b=>b.onclick=()=>{filter=b.dataset.f;filterName=b.dataset.n;$('video').className='w-full h-full object-cover '+filter;document.querySelectorAll('.f div').forEach(x=>x.classList.remove('border-rose-500'));b.firstElementChild.classList.add('border-rose-500')});document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.classList.add('text-neutral-500'));b.classList.remove('text-neutral-500')});
async function startCamera(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});$('video').srcObject=stream}catch(e){$('aiText').textContent='Camera permission unavailable. Feed and uploads still work.'}}
$('flip').onclick=async()=>{facing=facing==='user'?'environment':'user';await startCamera()};$('flashBtn').onclick=()=>{$('flash').style.opacity=1;setTimeout(()=>$('flash').style.opacity=0,120)};
$('capture').onclick=async()=>{if(!$('video').videoWidth)return;const c=document.createElement('canvas');c.width=$('video').videoWidth;c.height=$('video').videoHeight;const ctx=c.getContext('2d');if(filter!=='filter-none'){ctx.filter=getComputedStyle($('video')).filter}ctx.drawImage($('video'),0,0,c.width,c.height);c.toBlob(async blob=>{const fd=new FormData();fd.append('media',blob,'capture.jpg');fd.append('filter',filter);fd.append('mode',mode);fd.append('caption',`New ${mode} captured with ${filterName} filter ✨`);try{await api('/api/posts',{method:'POST',body:fd});show('feed')}catch(e){alert(e.message)}},'image/jpeg',.9)};
async function loadFeed(){try{const posts=await api('/api/feed');$('feedList').innerHTML=posts.map(p=>`<article class="border-b border-neutral-800"><div class="p-3 text-sm font-bold">@${esc(p.username)}</div><img src="${p.media_url}" class="w-full aspect-square object-cover ${p.filter}"><div class="p-3"><div class="flex gap-4"><button onclick="likePost(${p.id})">♥ ${p.likes}</button><button onclick="commentPost(${p.id})">💬 ${p.comments}</button></div><p class="text-sm mt-2"><b>@${esc(p.username)}</b> ${esc(p.caption)}</p></div></article>`).join('')||'<p class="p-6 text-neutral-500">No posts yet. Create the first one.</p>'}catch(e){$('feedList').innerHTML='<p class="p-6">'+e.message+'</p>'}}
async function likePost(id){try{await api('/api/posts/'+id+'/like',{method:'POST'});loadFeed()}catch(e){alert(e.message)}}async function commentPost(id){const text=prompt('Comment');if(text)await api('/api/posts/'+id+'/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});loadFeed()}
async function loadNotifs(){const n=await api('/api/notifications');$('notifs').innerHTML=n.map(x=>`<div class="text-sm p-3 bg-neutral-900 rounded-xl"><b>@${esc(x.username)}</b> ${x.type==='follow'?'started following you':x.type==='like'?'liked your post':'commented on your post'}</div>`).join('')||'<p class="text-neutral-500">No notifications.</p>'}
async function loadProfile(){const p=await api('/api/users/'+encodeURIComponent(me.username));$('profileName').textContent='@'+me.username;$('profileBody').innerHTML=`<div class="mb-5"><h2 class="text-xl font-bold">@${esc(p.username)}</h2><p class="text-sm text-neutral-400">${esc(p.bio||'Coon Creator')}</p><div class="flex gap-8 mt-4 text-sm"><b>${p.posts.length}<span class="block text-neutral-500 font-normal">Posts</span></b><b>${p.followers}<span class="block text-neutral-500 font-normal">Followers</span></b><b>${p.following}<span class="block text-neutral-500 font-normal">Following</span></b></div></div><div class="grid grid-cols-3 gap-1">${p.posts.map(x=>`<img src="${x.media_url}" class="aspect-square object-cover ${x.filter}">`).join('')}</div>`}
$('sendMsg').onclick=sendMessage;$('chatInput').onkeydown=e=>{if(e.key==='Enter')sendMessage()};let chatUser=1;async function sendMessage(){const t=$('chatInput').value.trim();if(!t)return;await api('/api/messages/'+chatUser,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});$('chatInput').value='';loadChat()};async function loadChat(){try{const m=await api('/api/messages/'+chatUser);$('chat').innerHTML=m.map(x=>`<div class="${x.sender_id===me.id?'text-right':''}"><span class="inline-block max-w-[80%] px-3 py-2 rounded-2xl ${x.sender_id===me.id?'bg-rose-600':'bg-neutral-800'} text-sm">${esc(x.text)}</span></div>`).join('')}catch{}}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
$('aiBtn').onclick=()=>$('aiPanel').classList.toggle('hidden');$('aiClose').onclick=()=>$('aiPanel').classList.add('hidden');$('analyze').onclick=async()=>{$('aiText').textContent='Analyzing...';try{const d=await api('/api/ai/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filter:filterName,mode})});$('aiText').textContent=d.message}catch(e){$('aiText').textContent='AI suggestion unavailable: '+e.message}};
$('messages').addEventListener('transitionend',loadChat);lucide.createIcons();
(async()=>{if(token){try{me=await api('/api/me');$('auth').classList.add('hidden');show('feed');startCamera()}catch{localStorage.removeItem('coon_token')}}})();
</script></body></html>
